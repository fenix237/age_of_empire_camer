name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.4
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze --fatal-infos
      - run: dart run tool/check_arch.dart
      # Les images de référence (goldens) sont comparées sous Windows seulement.
      - run: flutter test --coverage --exclude-tags golden
      # Couverture de la simulation : seuil de la roadmap (Phase 1).
      - run: dart run tool/coverage.dart lib/sim --min 90

  goldens-windows:
    runs-on: windows-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.4
          cache: true
      - run: flutter pub get
      - run: flutter test --tags golden

  build-windows:
    runs-on: windows-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.4
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release

  build-android:
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.4
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      # Garde-fou : l'application hors ligne ne doit demander aucune permission réseau.
      - name: Vérifier l'absence de permission INTERNET
        run: |
          if grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            echo "INTERNET interdit dans le manifeste principal"; exit 1
          fi
