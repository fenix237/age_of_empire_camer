include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - '**/*.g.dart'
    - '**/*.freezed.dart'

linter:
  rules:
    # Documentation exhaustive inutile pour un projet de jeu solo.
    public_member_api_docs: false
    # Les journaux passent par AppLogger, jamais par print.
    avoid_print: true
    # Le français est la langue du projet : les commentaires peuvent l'être.
    lines_longer_than_80_chars: false
    # Style de cascade jugé moins lisible dans le code de simulation.
    cascade_invocations: false
    # Les ordres/valeurs sont comparés par valeur (==) sans être @immutable.
    avoid_equals_and_hash_code_on_mutable_classes: false
    # Les fabriques JSON statiques sont plus claires que des constructeurs.
    prefer_constructors_over_static_methods: false
    # La simulation exige des entiers 64 bits natifs (VM Dart : Windows et
    # Android). Le web n'est pas une cible, voir docs/DECISIONS.md.
    avoid_js_rounded_ints: false
